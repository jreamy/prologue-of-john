<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cardo:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><path d='M6 4h18a2 2 0 0 1 2 2v20a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z' fill='%234A0E4E'/><path d='M16 4v24' stroke='%23220525' stroke-width='1.5'/><path d='M15 6h2v17h-2z' fill='%23FFD700'/><path d='M13 9h6v2h-6z' fill='%23FFD700'/><path d='M10 13h12v2h-12z' fill='%23FFD700'/><path d='M13 18L19 20v2L13 20z' fill='%23FFD700'/></svg>">
    <link rel="stylesheet" href="index.css">

    <title>Prologue of John</title>
</head>
<body>
    <main>
        <h1>Prologue of John</h1>
        <small><i>Click text to hear it pronounced. Italicised words or phrases have isolated audio.</i></small>

        <div id="text-container"></div>

        <div id="audio-container"></div>

        <script>
            const audio = [
                "1.1", "1.2", "1.3", "2", "3.1", "3.2", "4.1", "4.2", "5.1", "5.2",
                "6.1", "6.2", "7.1", "7.2", "7.3", "8.1", "8.2", "9.1", "9.2", "9.3",
                "10.1", "10.2", "10.3", "11.1", "11.2", "12.1", "12.2", "12.3",
                "13", "14.1", "14.2", "14.3", "14.4", "15.1", "15.2", "15.3", "15.4",
                "16.1", "16.2", "17.1", "17.2", "18.1", "18.2",
                "ἀπεσταλμένος", "ἐγεννήθησαν", "ἐθεασάμεθα", "ἔμπροσθέν μου", "ἐξηγήσατο",
                "ἐξουσίαν", "ἐσκήνωσεν", "ἑώρακεν", "θελήματος", "μονογενοῦς", "μαρτυρήσῃ",
                "Μωϋσέως", "Ὁ ὀπίσω μου", "οἱ ἴδιοι", "πιστεύουσιν", "πιστεύσωσιν"
            ].map(a => `
                <audio id="s_${a.replace(".", "_")}" src="audio/${a}.m4a" preload="auto"></audio>
            `)
            document.getElementById('audio-container').innerHTML = audio.join("\n");

            const aud = (text, idx) => `<span class="audio-trigger" onclick="document.getElementById('s_${idx.replace(".", "_")}').play()">${text}</span>`
            const chd = (text) => `<span class="audio-trigger child" onclick="event.stopPropagation(); document.getElementById('s_${text}').play()">${text}</span>`

            document.getElementById('text-container').innerHTML = `
            <p>
                <sup>1</sup>${aud(`Ἐν ἀρχῇ ἦν ὁ λόγος`, "1.1")},
                ${aud(`καὶ ὁ λόγος ἦν πρὸς τὸν θεόν`, "1.2")},
                ${aud(`καὶ θεὸς ἦν ὁ λόγος`, "1.3")}.
                <sup>2</sup>${aud(`οὗτος ἦν ἐν ἀρχῇ πρὸς τὸν θεόν.`, "2")}
                <sup>3</sup>${aud(`πάντα δι’ αὐτοῦ ἐγένετο`, "3.1")}, 
                ${aud(`καὶ χωρὶς αὐτοῦ ἐγένετο οὐδὲ ἕν`, "3.2")}. 
                ${aud(`ὃ γέγονεν <sup>4</sup>ἐν αὐτῷ ζωὴ ἦν`, "4.1")}, 
                ${aud(`καὶ ἡ ζωὴ ἦν τὸ φῶς τῶν ἀνθρώπων`, "4.2")}·
                <sup>5</sup>${aud(`καὶ τὸ φῶς ἐν τῇ σκοτίᾳ φαίνει`, "5.1")}, 
                ${aud(`καὶ ἡ σκοτία αὐτὸ οὐ κατέλαβεν`, "5.2")}.
            </p>
            <p>
                <sup>6</sup>${aud(`Ἐγένετο ἄνθρωπος ${chd(`ἀπεσταλμένος`)} παρὰ θεοῦ`, "6.1")}, 
                ${aud(`ὄνομα αὐτῷ Ἰωάννης`, "6.2")}·
                <sup>7</sup>${aud(`οὗτος ἦλθεν εἰς μαρτυρίαν`, "7.1")}, 
                ${aud(`ἵνα ${chd(`μαρτυρήσῃ`)} περὶ τοῦ φωτός`, "7.2")}, 
                ${aud(`ἵνα πάντες ${chd(`πιστεύσωσιν`)} δι’ αὐτοῦ`, "7.3")}.
                <sup>8</sup>${aud(`οὐκ ἦν ἐκεῖνος τὸ φῶς`, "8.1")}, 
                ${aud(`ἀλλ’ ἵνα ${chd(`μαρτυρήσῃ`)} περὶ τοῦ φωτός`, "8.2")}.
                <sup>9</sup>${aud(`Ἦν τὸ φῶς τὸ ἀληθινὸν`, "9.1")}, 
                ${aud(`ὃ φωτίζει πάντα ἄνθρωπον`, "9.2")}, 
                ${aud(`ἐρχόμενον εἰς τὸν κόσμον`, "9.3")}.
                <sup>10</sup>${aud(`Ἐν τῷ κόσμῳ ἦν`, "10.1")}, 
                ${aud(`καὶ ὁ κόσμος δι’ αὐτοῦ ἐγένετο`, "10.2")}, 
                ${aud(`καὶ ὁ κόσμος αὐτὸν οὐκ ἔγνω`, "10.3")}.
                <sup>11</sup>${aud(`εἰς τὰ ἴδια ἦλθεν`, "11.1")}, 
                ${aud(`καὶ ${chd(`οἱ ἴδιοι`)} αὐτὸν οὐ παρέλαβον`, "11.2")}.
                <sup>12</sup>${aud(`ὅσοι δὲ ἔλαβον αὐτόν`, "12.1")}, 
                ${aud(`ἔδωκεν αὐτοῖς ${chd(`ἐξουσίαν`)} τέκνα θεοῦ γενέσθαι`, "12.2")}, 
                ${aud(`τοῖς ${chd(`πιστεύουσιν`)} εἰς τὸ ὄνομα αὐτοῦ`, "12.3")},
                <sup>13</sup>${aud(`οἳ οὐκ ἐξ αἱμάτων οὐδὲ ἐκ θελήματος σαρκὸς οὐδὲ ἐκ θελήματος ἀνδρὸς ἀλλ’ ἐκ θεοῦ ${chd(`ἐγεννήθησαν`)}`, "13")}.
            </p>
            <p>
                <sup>14</sup>${aud(`Καὶ ὁ λόγος σὰρξ ἐγένετο καὶ ${chd(`ἐσκήνωσεν`)} ἐν ἡμῖν`, "14.1")}, 
                ${aud(`καὶ ${chd(`ἐθεασάμεθα`)} τὴν δόξαν αὐτοῦ`, "14.2")}, 
                ${aud(`δόξαν ὡς ${chd(`μονογενοῦς`)} παρὰ πατρός`, "14.3")}, 
                ${aud(`πλήρης χάριτος καὶ ἀληθείας`, "14.4")}·
                <sup>15</sup>${aud(`Ἰωάννης μαρτυρεῖ περὶ αὐτοῦ καὶ κέκραγεν λέγων`, "15.1")}· 
                ${aud(`Οὗτος ἦν ὃν εἶπον`, "15.2")}· 
                ${aud(`${chd(`Ὁ ὀπίσω μου`)} ἐρχόμενος ${chd(`ἔμπροσθέν μου`)} γέγονεν`, "15.3")}, 
                ${aud(`ὅτι πρῶτός μου ἦν`, "15.4")}.
                <sup>16</sup>${aud(`ὅτι ἐκ τοῦ πληρώματος αὐτοῦ ἡμεῖς πάντες ἐλάβομεν`, "16.1")}, 
                ${aud(`καὶ χάριν ἀντὶ χάριτος`, "16.2")}·
                <sup>17</sup>${aud(`ὅτι ὁ νόμος διὰ ${chd(`Μωϋσέως`)} ἐδόθη`, "17.1")}, 
                ${aud(`ἡ χάρις καὶ ἡ ἀλήθεια διὰ Ἰησοῦ Χριστοῦ ἐγένετο`, "17.2")}.
                <sup>18</sup>${aud(`θεὸν οὐδεὶς ${chd(`ἑώρακεν`)} πώποτε`, "18.1")}· 
                ${aud(`μονογενὴς θεὸς ὁ ὢν εἰς τὸν κόλπον τοῦ πατρὸς ἐκεῖνος ${chd(`ἐξηγήσατο`)}`, "18.2")}.
            </p>
            `
        </script>
    </main>
</body>
</html>
